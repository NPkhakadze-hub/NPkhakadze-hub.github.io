    document.open(); document.write(html); document.close();
  }catch(e){
    fails++;
    const wait = Math.min(30, Math.pow(2, Math.max(0, fails-2)));
    err.textContent = fails >= 3 ? `პაროლი არასწორია — სცადე ${wait} წამში` : "პაროლი არასწორია — სცადე ისევ";
    await new Promise(r => setTimeout(r, fails >= 3 ? wait*1000 : 400));
  }
  busy = false;
}
document.getElementById("go").addEventListener("click", unlock);
document.getElementById("pw").addEventListener("keydown", e => { if(e.key === "Enter") unlock(); });
document.getElementById("pw").focus();
</script>
