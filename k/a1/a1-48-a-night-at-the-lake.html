<script>
(async function(){
  var LV="a1";
  function fail(w){document.getElementById('wait').hidden=true;
    document.getElementById('why').textContent=NDK.text(w);document.getElementById('note').hidden=false;}
  var s=await NDK.session();
  if(!s.ok)return fail(s.why);
  if(!s.keys||!s.keys[LV])return fail('nolevel');
  var P=JSON.parse(document.getElementById('enc').textContent), h;
  try{h=await NDK.decrypt(s.keys[LV],P);}catch(e){return fail('dec');}
  // document.open() is ignored while the parser is still running (cached session = fast path)
  if(document.readyState==='loading')await new Promise(function(r){
    document.addEventListener('DOMContentLoaded',r);});
  document.open();document.write(h);document.close();
  // Personal stamp + way back to the list
  var a=document.createElement('a');a.href='/k/';a.textContent='☰ '+(s.name||'');
  a.setAttribute('style','position:fixed;top:10px;right:10px;z-index:30;background:rgba(255,255,255,.92);'+
    'border:1px solid #e8e0d4;border-radius:999px;padding:5px 12px;font:13px/1.4 system-ui,sans-serif;'+
    'color:#6b6156;text-decoration:none;box-shadow:0 4px 14px rgba(60,45,20,.08)');
  document.body.appendChild(a);
})();
</script>
