<script>
(function(){
  var P=JSON.parse(document.getElementById('enc').textContent);
  var f=document.getElementById('f'),pw=document.getElementById('pw'),msg=document.getElementById('msg'),go=document.getElementById('go');
  var TXT={bad:"კოდი არასწორია — სცადე თავიდან ან მომწერე.",wait:"იხსნება…",nokey:"ბრაუზერი ამ ფუნქციას მხარს არ უჭერს — გახსენი Chrome-ში ან Safari-ში.",slow:"მეტისმეტად ბევრი მცდელობა — დაელოდე {s} წმ…"};
  var b64=function(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;};
  var SKEY='lk:'+location.pathname, FKEY='fx:'+location.pathname;
  function fails(){try{return parseInt(sessionStorage.getItem(FKEY)||'0',10)||0;}catch(e){return 0;}}
  function bumpFails(n){try{sessionStorage.setItem(FKEY,String(n));}catch(e){}}
  // მე-3 შეცდომიდან დაყოვნება ორმაგდება: 2, 4, 8 … მაქს. 30 წმ
  function penalty(n){return n<3?0:Math.min(30000,1000*Math.pow(2,n-2));}
  async function open(code,fromHash){
    if(!window.crypto||!crypto.subtle){msg.textContent=TXT.nokey;return false;}
    go.disabled=true;
    var wait=penalty(fails());
    if(wait>0){
      for(var left=Math.ceil(wait/1000);left>0;left--){
        msg.className='msg';msg.textContent=TXT.slow.replace('{s}',left);
        await new Promise(function(r){setTimeout(r,1000);});
      }
    }
    msg.className='msg ok';msg.textContent=TXT.wait;
    try{
      var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(code),'PBKDF2',false,['deriveKey']);
      var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.salt),iterations:P.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
      var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.iv)},key,b64(P.ct));
      var htmlText=new TextDecoder().decode(pt);
      try{sessionStorage.setItem(SKEY,code);sessionStorage.removeItem(FKEY);}catch(e){}
      if(fromHash){try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}}
      document.open();document.write(htmlText);document.close();
      return true;
    }catch(e){
      bumpFails(fails()+1);
      msg.className='msg';msg.textContent=TXT.bad;go.disabled=false;pw.select();return false;
    }
  }
  f.addEventListener('submit',function(e){e.preventDefault();var c=pw.value.trim();if(c)open(c,false);});
  var m=/[#&]k=([^&]+)/.exec(location.hash);
  if(m){open(decodeURIComponent(m[1]),true);}
  else{var s=null;try{s=sessionStorage.getItem(SKEY);}catch(e){} if(s)open(s,false);else pw.focus();}
})();
</script>
